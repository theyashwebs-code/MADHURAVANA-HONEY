<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order | MADHURAVANA Pure Honey</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..650,0..100&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Site-wide styles (header / footer / buttons) -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="premium.css">
<link rel="stylesheet" href="magic-upgrade.css">
<link rel="stylesheet" href="wow.css">

<link rel="stylesheet" href="mobile-premium.css">

<style>
/* =====================================================================
   MADHURAVANA · ORDER TRACKING  (all track styles live here)
===================================================================== */
.tk-page{
  --tk-ink:#1f1a14;
  --tk-text:#3d352b;
  --tk-muted:#6b6258;
  --tk-line:#e6dfd2;
  --tk-line-strong:#d4cab8;
  --tk-bg:#f7f4ee;
  --tk-surface:#ffffff;
  --tk-brand:#3a2415;
  --tk-gold:#b7791f;
  --tk-gold-dark:#8a5a0b;
  --tk-gold-soft:#fbf1da;
  --tk-green:#2f7d4f;
  --tk-green-soft:#e6f3ea;
  --tk-red:#b3382c;
  --tk-red-soft:#fbeae7;
  --tk-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tk-serif:"Fraunces",Georgia,serif;
}
.tk-page .tk-section,
.tk-page .tk-section button,
.tk-page .tk-section input{font-family:var(--tk-sans)}

/* ---------- Section ---------- */
.tk-section{
  padding:72px 0 104px;
  background:var(--tk-bg);
  color:var(--tk-text);
}
.tk-section .container{position:relative;z-index:1}
.tk-section .container.narrow{max-width:760px}

/* ---------- Intro ---------- */
.tk-intro{text-align:center;margin-bottom:32px}
.tk-intro h1{
  font-family:var(--tk-serif);font-weight:600;
  font-size:clamp(2rem,5vw,2.9rem);line-height:1.1;letter-spacing:-.015em;
  color:var(--tk-ink);margin:0 0 12px;
}
.tk-intro p{max-width:48ch;margin:0 auto;color:var(--tk-muted);font-size:1rem;line-height:1.6}

/* ---------- Lookup form ---------- */
.tk-form{
  display:grid;grid-template-columns:1.3fr 1fr auto;gap:14px;align-items:end;
  margin:0;padding:22px;
  background:var(--tk-surface);
  border:1px solid var(--tk-line);
  border-radius:14px;
  box-shadow:0 1px 2px rgba(31,26,20,.05),0 8px 24px -12px rgba(31,26,20,.12);
}
.tk-field{display:block;font-size:.85rem;font-weight:600;color:var(--tk-ink)}
.tk-field span{display:block;margin:0 0 7px}
.tk-form input{
  display:block;width:100%;box-sizing:border-box;height:48px;
  padding:0 14px;border-radius:8px;
  border:1px solid var(--tk-line-strong);background:#fff;
  font:500 .95rem/1.2 var(--tk-sans);color:var(--tk-ink);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.tk-form input::placeholder{color:#a69c8d;font-weight:400}
.tk-form input:hover{border-color:#b8ad98}
.tk-form input:focus{border-color:var(--tk-gold);box-shadow:0 0 0 3px rgba(183,121,31,.2)}
.tk-go{
  cursor:pointer;border:0;height:48px;padding:0 28px;border-radius:8px;
  font:600 .95rem/1 var(--tk-sans);color:#fff;
  background:var(--tk-brand);
  transition:background .15s,box-shadow .15s;
}
.tk-go:hover{background:#2a190d}
.tk-go:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(183,121,31,.45)}
.tk-go:disabled{opacity:.65;cursor:progress}
.tk-secure{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:14px 0 0;font-size:.82rem;color:var(--tk-muted);
}
.tk-secure svg{flex:none}

/* ---------- Result card ---------- */
#tk-result{margin-top:28px}
.tk-card{
  position:relative;
  background:var(--tk-surface);color:var(--tk-text);
  border:1px solid var(--tk-line);border-radius:14px;
  padding:clamp(22px,4vw,36px);
  box-shadow:0 1px 2px rgba(31,26,20,.05),0 12px 32px -16px rgba(31,26,20,.18);
  animation:tkRise .35s ease-out both;
}
.tk-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.tk-head h2{
  margin:0 0 10px;font-family:var(--tk-serif);font-weight:600;
  font-size:clamp(1.35rem,3vw,1.7rem);line-height:1.2;letter-spacing:-.01em;color:var(--tk-ink);
}
.tk-meta{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;color:var(--tk-muted);font-size:.87rem}
.tk-meta .dotsep{width:3px;height:3px;border-radius:50%;background:#b8ad98}
.tk-idchip{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:5px 6px 5px 10px;border-radius:6px;
  background:#f3eee3;border:1px solid var(--tk-line);
  color:var(--tk-ink);font:600 .8rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;
  transition:background .15s,border-color .15s;
}
.tk-idchip:hover{background:#ece5d6;border-color:var(--tk-line-strong)}
.tk-idchip:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(183,121,31,.4)}
.tk-idchip b{
  font:600 .7rem/1 var(--tk-sans);padding:4px 7px;border-radius:4px;
  background:#fff;color:var(--tk-muted);border:1px solid var(--tk-line);
}

/* status pill */
.tk-pill{
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  padding:7px 13px;border-radius:99px;font-size:.82rem;font-weight:600;
  background:var(--tk-gold-soft);color:var(--tk-gold-dark);border:1px solid #efd9a6;
}
.tk-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tk-pill.done{background:var(--tk-green-soft);color:var(--tk-green);border-color:#bfdcca}
.tk-pill.bad{background:var(--tk-red-soft);color:var(--tk-red);border-color:#f0c5be}

/* current status panel */
.tk-now{
  display:block;margin:26px 0 0;padding:14px 18px;border-radius:8px;
  background:var(--tk-gold-soft);border-left:3px solid var(--tk-gold);
}
.tk-now strong{display:block;font-weight:600;font-size:1rem;color:var(--tk-ink)}
.tk-now span{display:block;margin-top:3px;font-size:.9rem;color:var(--tk-text);line-height:1.5}

/* ---------- Stepper (horizontal ≥720px, vertical below) ---------- */
.tk-steps{
  position:relative;list-style:none;margin:30px 0 4px;padding:0;
  display:grid;grid-template-columns:repeat(5,1fr);
}
.tk-steps li{position:relative;text-align:center;padding:0 4px}
.tk-steps li::before{ /* rail to next step */
  content:"";position:absolute;top:17px;left:50%;width:100%;height:2px;
  background:var(--tk-line);
}
.tk-steps li.on::before{background:var(--tk-gold)}
.tk-steps li:last-child::before{display:none}
.tk-dot{
  position:relative;z-index:1;width:36px;height:36px;margin:0 auto 10px;box-sizing:border-box;
  display:grid;place-items:center;border-radius:50%;
  font-weight:600;font-size:.85rem;color:var(--tk-muted);
  background:#fff;border:2px solid var(--tk-line-strong);
}
.tk-steps li.on .tk-dot{background:var(--tk-gold);border-color:var(--tk-gold);color:#fff}
.tk-steps li.now .tk-dot{
  border-color:var(--tk-gold);color:var(--tk-gold-dark);background:#fff;
  box-shadow:0 0 0 4px rgba(183,121,31,.18);
}
.tk-steps strong{display:block;font-weight:500;font-size:.86rem;line-height:1.3;color:var(--tk-muted)}
.tk-steps li.on strong{color:var(--tk-text)}
.tk-steps li.now strong{color:var(--tk-ink);font-weight:600}

/* ---------- Cancel order ---------- */
.tk-cancel-actions{
  margin:24px 0 0;padding:16px 18px;border-radius:10px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:#fdf6f4;border:1px solid #f1d6d1;
}
.tk-cancel-actions p{margin:0;color:var(--tk-muted);font-size:.86rem;line-height:1.5;order:-1;flex:1 1 220px}
.tk-cancel-btn{
  display:inline-flex;align-items:center;justify-content:center;
  height:42px;padding:0 18px;border-radius:8px;
  border:1px solid #d9a199;background:#fff;color:var(--tk-red);
  font:600 .88rem/1 var(--tk-sans);cursor:pointer;
  transition:background .15s,border-color .15s;
}
.tk-cancel-btn:hover{background:var(--tk-red-soft);border-color:var(--tk-red)}
.tk-cancel-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(179,56,44,.3)}
.tk-cancel-btn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:480px){.tk-cancel-btn{width:100%}}

/* ---------- Cancel confirmation dialog ---------- */
.tk-modal-backdrop{
  position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(31,26,20,.55);backdrop-filter:blur(3px);
  animation:tkModalFade .15s ease both;
}
.tk-modal-card{
  width:min(100%,420px);box-sizing:border-box;
  padding:28px;border-radius:14px;text-align:center;
  background:#fff;color:var(--tk-text);font-family:var(--tk-sans);
  border:1px solid var(--tk-line);box-shadow:0 24px 60px rgba(31,26,20,.3);
  animation:tkModalRise .2s ease-out both;
}
.tk-modal-mark{
  width:48px;height:48px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;
  background:var(--tk-gold-soft);color:var(--tk-gold-dark);font-size:1.3rem;font-weight:700;
}
.tk-modal-card h3{margin:0 0 8px;color:var(--tk-ink);font:600 1.3rem/1.25 var(--tk-serif)}
.tk-modal-card p{margin:0 auto 16px;max-width:36ch;color:var(--tk-muted);font-size:.93rem;line-height:1.6}
.tk-modal-order{
  margin:0 auto 20px;padding:10px 12px;border-radius:8px;background:#f3eee3;border:1px solid var(--tk-line);
  color:var(--tk-ink);font:600 .82rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;
}
.tk-modal-actions{display:flex;gap:10px;flex-direction:column}
.tk-modal-actions button{
  width:100%;height:46px;border-radius:8px;padding:0 16px;
  font:600 .92rem/1 var(--tk-sans);cursor:pointer;transition:background .15s,border-color .15s;
}
.tk-modal-wa{display:flex;align-items:center;justify-content:center;width:100%;height:46px;box-sizing:border-box;border-radius:8px;padding:0 16px;
  background:#1f9d55;border:1px solid #1f9d55;color:#fff;font:600 .92rem/1 var(--tk-sans);text-decoration:none;transition:background .15s}
.tk-modal-wa:hover{background:#188147;color:#fff}
.tk-modal-wa:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(31,157,85,.4)}
.tk-modal-confirm{border:1px solid var(--tk-red);background:var(--tk-red);color:#fff}
.tk-modal-confirm:hover{background:#992f24}
.tk-modal-keep{border:1px solid var(--tk-line-strong);background:#fff;color:var(--tk-ink)}
.tk-modal-keep:hover{background:#f7f4ee}
.tk-modal-actions button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(183,121,31,.4)}
.tk-modal-actions button:disabled{opacity:.6;cursor:wait}
.tk-modal-card.tk-modal-success .tk-modal-mark{background:var(--tk-green-soft);color:var(--tk-green)}
.tk-modal-card.tk-modal-error .tk-modal-mark{background:var(--tk-red-soft);color:var(--tk-red)}
@keyframes tkModalFade{from{opacity:0}to{opacity:1}}
@keyframes tkModalRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:480px){.tk-modal-card{padding:24px 20px}}

/* ---------- Cancelled notice ---------- */
.tk-cancel{
  display:flex;gap:14px;align-items:flex-start;margin:26px 0 4px;
  padding:16px 18px;border-radius:8px;background:var(--tk-red-soft);border-left:3px solid var(--tk-red);
}
.tk-cancel .hex{
  flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  background:var(--tk-red);color:#fff;font-size:.8rem;font-weight:700;
}
.tk-cancel strong{display:block;font-weight:600;font-size:1rem;color:#7d261d}
.tk-cancel span{display:block;margin-top:3px;font-size:.9rem;color:#8a3a31;line-height:1.5}

/* ---------- Items ---------- */
.tk-items{margin-top:30px;padding-top:4px;border-top:1px solid var(--tk-line)}
.tk-items h3{margin:20px 0 6px;font:600 .95rem/1.2 var(--tk-sans);color:var(--tk-ink)}
.tk-line{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--tk-line);font-size:.94rem;color:var(--tk-text)}
.tk-line span:last-child{font-variant-numeric:tabular-nums;color:var(--tk-ink);font-weight:600}
.tk-line em{font-style:normal;color:var(--tk-muted)}
.tk-tot{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:14px;padding:16px 18px;border-radius:8px;
  background:#f7f4ee;border:1px solid var(--tk-line);
}
.tk-tot span:first-child{font-size:.9rem;color:var(--tk-muted)}
.tk-tot span:last-child{font-family:var(--tk-serif);font-weight:600;font-size:1.5rem;color:var(--tk-ink);font-variant-numeric:tabular-nums}
.tk-note{display:flex;align-items:center;gap:10px;margin:20px 0 0;font-size:.82rem;color:var(--tk-muted)}
.tk-live{width:8px;height:8px;border-radius:50%;background:#4aa56d;flex:none}

/* ---------- Messages & skeleton ---------- */
.tk-msg{
  display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:10px;
  background:var(--tk-red-soft);border:1px solid #f0c5be;color:#7d261d;font-size:.93rem;line-height:1.55;
  animation:tkRise .3s ease-out both;
}
.tk-msg b{display:block;margin-bottom:2px;font-weight:600;font-size:1rem}
.tk-msg .ic{
  flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  background:var(--tk-red);color:#fff;font-weight:700;font-size:.85rem;
}
.tk-skel{border-radius:14px;padding:32px;background:#fff;border:1px solid var(--tk-line)}
.tk-skel i{
  display:block;height:14px;border-radius:6px;margin-bottom:14px;
  background:linear-gradient(90deg,#eee8da 25%,#f7f3ea 50%,#eee8da 75%);
  background-size:200% 100%;animation:tkShimmer 1.4s linear infinite;
}
.tk-skel i:nth-child(1){width:50%;height:22px}
.tk-skel i:nth-child(2){width:30%}
.tk-skel i:nth-child(3){width:100%;height:56px;border-radius:8px;margin-top:22px}
.tk-skel i:nth-child(4){width:75%}

/* ---------- My orders ---------- */
.tk-my-title{margin:48px 0 4px;font-family:var(--tk-serif);font-weight:600;font-size:1.4rem;color:var(--tk-ink);letter-spacing:-.01em}
.tk-my-sub{margin:0 0 16px;color:var(--tk-muted);font-size:.9rem}
.tk-my{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;
  font:inherit;cursor:pointer;margin-bottom:10px;padding:14px 18px;color:inherit;
  background:var(--tk-surface);
  border:1px solid var(--tk-line);border-radius:10px;
  transition:border-color .15s,box-shadow .15s;
}
.tk-my:hover,.tk-my:focus-visible{border-color:var(--tk-gold);box-shadow:0 4px 14px -6px rgba(31,26,20,.18);outline:none}
.tk-my:focus-visible{box-shadow:0 0 0 3px rgba(183,121,31,.35)}
.tk-my .lead{display:flex;align-items:center;gap:14px;min-width:0}
.tk-my .hx{display:none}
.tk-my strong{display:block;font:600 .88rem/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tk-ink);word-break:break-all}
.tk-my small{display:block;margin-top:5px;color:var(--tk-muted);font-size:.82rem}
.tk-my .tk-pill{flex:none;font-size:.76rem;padding:5px 11px}

/* ---------- Motion ---------- */
@keyframes tkRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tkShimmer{to{background-position:-200% 0}}

/* ---------- Responsive ---------- */
@media(max-width:720px){
  .tk-section{padding:48px 0 72px}
  .tk-form{grid-template-columns:1fr;padding:18px}
  .tk-go{width:100%}
  .tk-steps{grid-template-columns:1fr;margin-top:24px}
  .tk-steps li{display:flex;align-items:center;gap:14px;text-align:left;padding:0 0 20px}
  .tk-steps li:last-child{padding-bottom:0}
  .tk-steps li::before{top:36px;left:17px;width:2px;height:calc(100% - 36px)}
  .tk-dot{margin:0;flex:none}
  .tk-steps strong{font-size:.95rem}
  .tk-my{padding:12px 14px}
}
@media(prefers-reduced-motion:reduce){
  .tk-card,.tk-msg,.tk-skel i,.tk-modal-backdrop,.tk-modal-card{animation:none}
}
</style>
</head>

<body data-page="track" class="tk-page">
  <div id="site-header"></div>

  <main>
    <section class="section tk-section">
      <div class="container narrow">

        <header class="tk-intro"><br>
          <h1>Track your order</h1>
          <p>Enter your order ID and the phone number you used at checkout to see the latest status.</p>
        </header>

        <form class="tk-form" id="tk-form" autocomplete="off">
          <label class="tk-field"><span>Order ID</span>
            <input id="tk-id" placeholder="e.g. MH20261007ABCD1234" required autocapitalize="characters" spellcheck="false">
          </label>
          <label class="tk-field"><span>Phone number</span>
            <input id="tk-phone" inputmode="numeric" placeholder="10-digit mobile number" maxlength="14" required>
          </label>
          <button class="tk-go" type="submit" id="tk-btn">Track order</button>
        </form>

        <p class="tk-secure">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Your order is shown only when the ID and phone number both match.
        </p>

        <div id="tk-result" aria-live="polite"></div>
        <div id="tk-orders"></div>

      </div>
    </section>
  </main>

  <div id="site-footer"></div><div id="modal-root"></div><div id="toast-root"></div>

  <script src="supabase-config.js"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
  <script src="motion.js"></script>

  <script>
/* MADHURAVANA order tracking
   Supabase RPC: track_order(id, phone)
   Same-browser fallback included
*/
(function () {
  "use strict";

  var STEPS = [
    ["Order placed", "We have received your order."],
    ["Processing", "Your honey is being packed with care."],
    ["Shipped", "Your parcel has left us and is on the way."],
    ["Out for delivery", "The delivery partner is bringing it to your door."],
    ["Delivered", "Your order has been delivered. Enjoy your pure honey!"]
  ];

  /* Status values stored in the database (must match admin panel / RPC) */
  var STATUS_KEYS = ["Order Placed", "Processing", "Shipped", "Out for Delivery", "Delivered"];

  var $ = function (s) { return document.querySelector(s); };

  var form = $("#tk-form");
  var out = $("#tk-result");
  var timer = null;

  /* ---------- Safe fallbacks for helpers from script.js ---------- */
  function E(s) {
    if (typeof window.esc === "function") return window.esc(s);
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function M(n) {
    if (typeof window.money === "function") return window.money(n);
    return "₹" + Number(n || 0).toLocaleString("en-IN");
  }

  function orders() {
    try {
      if (typeof getOnlineOrders === "function") return getOnlineOrders() || [];
    } catch (e) {}
    return [];
  }

  /* =========================================================
     PHONE NORMALIZATION
  ========================================================= */
  function digits(s) {
    return String(s || "").replace(/\D/g, "").slice(-10);
  }

  /* =========================================================
     SUPABASE
  ========================================================= */
  function cloud() {
    var sb = window.MADHURAVANA_SUPABASE;
    return sb && (typeof sb.client === "function" ? sb.client() : sb.client);
  }

  function configured() {
    var sb = window.MADHURAVANA_SUPABASE;
    return !!(sb && sb.isConfigured && sb.isConfigured() && cloud());
  }

  /* =========================================================
     LOOKUP ONE ORDER
     Order ID + phone number are BOTH required.
  ========================================================= */
  async function lookup(id, phone) {

    if (window.MADHURAVANA_SUPABASE && window.MADHURAVANA_SUPABASE.readyPromise) {
      try { await window.MADHURAVANA_SUPABASE.readyPromise; } catch (e) {}
    }

    /* ---- Supabase ---- */
    if (configured()) {

      var r = await cloud().rpc("track_order", { p_id: id, p_phone: phone });

      if (r.error) {
        console.warn("track_order:", r.error.message);
        return null;
      }

      if (r.data && r.data.length) {
        var d = r.data[0];
        return {
          id: d.id,
          status: d.status,
          date: d.order_date,
          time: d.order_time,
          total: d.total,
          products: d.products || [],
          name: d.customer_name,
          city: d.city,
          phone: phone
        };
      }
      return null;
    }

    /* ---- Same-browser fallback (ID + PHONE must match) ---- */
    var normalizedPhone = digits(phone);

    var o = orders().filter(function (x) {
      return (
        String(x.id || "").toUpperCase() === String(id || "").toUpperCase() &&
        digits(x.phone) === normalizedPhone
      );
    })[0];

    if (!o) return null;

    return {
      id: o.id,
      status: o.status,
      date: o.orderDate,
      time: o.orderTime,
      total: o.total,
      products: o.products || [],
      name: String(o.customerName || "").split(" ")[0],
      city: (o.address || {}).city,
      phone: normalizedPhone
    };
  }

  /* =========================================================
     RENDER SINGLE ORDER
  ========================================================= */
  function statusLabel(status) {
    var i = STATUS_KEYS.indexOf(status);
    return i >= 0 ? STEPS[i][0] : (status || "Order placed");
  }

  function render(o) {

    var cancelled = o.status === "Cancelled";
    var idx = STATUS_KEYS.indexOf(o.status);
    if (!cancelled && idx < 0) idx = 0;

    var pill = cancelled ? "bad" : (idx === 4 ? "done" : "");

    var progress;

    if (cancelled) {
      progress =
        '<div class="tk-cancel">' +
          '<div class="hex" aria-hidden="true">✕</div>' +
          '<div>' +
            '<strong>Order cancelled</strong>' +
            '<span>This order was cancelled. If this is a mistake, contact us on WhatsApp.</span>' +
          '</div>' +
        '</div>';
    } else {

      var now =
        '<div class="tk-now">' +
          '<strong>' + E(STEPS[idx][0]) + '</strong>' +
          '<span>' + E(STEPS[idx][1]) + '</span>' +
        '</div>';

      var steps = STEPS.map(function (s, i) {
        var c = i < idx ? "on" : (i === idx ? "now" : "");
        var mark = (i < idx || (idx === 4 && i === 4)) ? "✓" : (i + 1);
        return (
          '<li class="' + c + '"' + (i === idx ? ' aria-current="step"' : '') + '>' +
            '<span class="tk-dot">' + mark + '</span>' +
            '<strong>' + s[0] + '</strong>' +
          '</li>'
        );
      }).join("");

      progress = now + '<ol class="tk-steps">' + steps + '</ol>';
    }

    var items = (o.products || []).map(function (p) {
      return (
        '<div class="tk-line">' +
          '<span>' +
            E(p.name || "Honey") + " " + E(p.weight || "") +
            ' <em>× ' + Number(p.quantity || 0) + '</em>' +
          '</span>' +
          '<span>' + M(Number(p.price || 0) * Number(p.quantity || 0)) + '</span>' +
        '</div>'
      );
    }).join("");

    var meta = [];
    if (o.date || o.time) meta.push(E((o.date || "") + " " + (o.time || "")).trim());
    if (o.city) meta.push(E(o.city));
    if (o.name) meta.push("Ordered by " + E(o.name));

    out.innerHTML =
      '<div class="tk-card">' +

        '<div class="tk-head">' +
          '<div>' +
            '<h2>Order details</h2>' +
            '<div class="tk-meta">' +
              '<button type="button" class="tk-idchip" id="tk-copy" title="Copy order ID">' +
                E(o.id) + '<b>Copy</b>' +
              '</button>' +
              (meta.length ? '<i class="dotsep"></i><span>' + meta.join('</span><i class="dotsep"></i><span>') + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="tk-pill ' + pill + '">' + E(statusLabel(o.status)) + '</span>' +
        '</div>' +

        progress +

        '<div class="tk-items">' +
          '<h3>Items in this order</h3>' +
          items +
          '<div class="tk-tot">' +
            '<span>Total (pay on delivery)</span>' +
            '<span>' + M(o.total || 0) + '</span>' +
          '</div>' +
        '</div>' +

        ((o.status === "Order Placed" || o.status === "Processing")
          ? '<div class="tk-cancel-actions">' +
              '<p>You can cancel this order until it is dispatched.</p>' +
              '<button type="button" id="tk-cancel-btn" class="tk-cancel-btn">Cancel order</button>' +
            '</div>'
          : '') +

        '<p class="tk-note"><span class="tk-live"></span>' +
          'This page refreshes automatically. Questions? Message us on WhatsApp.' +
        '</p>' +

      '</div>';

    var copy = $("#tk-copy");
    if (copy) {
      copy.addEventListener("click", function () {
        var b = copy.querySelector("b");
        try {
          navigator.clipboard.writeText(o.id).then(function () {
            b.textContent = "Copied";
            setTimeout(function () { b.textContent = "Copy"; }, 1600);
          });
        } catch (e) {}
      });
    }

    /* In-page cancellation dialog; no browser alert/confirm. */
    var cancelBtn = $("#tk-cancel-btn");
    if (cancelBtn) {
      cancelBtn.addEventListener("click", function () {
        openCancelDialog(o, cancelBtn);
      });
    }
  }

  function openCancelDialog(o, cancelBtn) {
    var old = document.querySelector(".tk-modal-backdrop");
    if (old) old.remove();

    var backdrop = document.createElement("div");
    backdrop.className = "tk-modal-backdrop";
    backdrop.setAttribute("role", "presentation");
    backdrop.innerHTML =
      '<section class="tk-modal-card" role="dialog" aria-modal="true" aria-labelledby="tk-modal-title" aria-describedby="tk-modal-desc">' +
        '<div class="tk-modal-mark" aria-hidden="true">!</div>' +
        '<h3 id="tk-modal-title">Cancel this order?</h3>' +
        '<p id="tk-modal-desc">This will cancel your honey order and cannot be undone.</p>' +
        '<div class="tk-modal-order">Order ' + E(o.id) + '</div>' +
        '<div class="tk-modal-actions">' +
          '<button type="button" class="tk-modal-confirm" id="tk-modal-confirm">Yes, cancel order</button>' +
          '<button type="button" class="tk-modal-keep" id="tk-modal-keep">Keep my order</button>' +
        '</div>' +
      '</section>';
    document.body.appendChild(backdrop);

    var card = backdrop.querySelector(".tk-modal-card");
    var title = backdrop.querySelector("#tk-modal-title");
    var desc = backdrop.querySelector("#tk-modal-desc");
    var mark = backdrop.querySelector(".tk-modal-mark");
    var confirmBtn = backdrop.querySelector("#tk-modal-confirm");
    var keepBtn = backdrop.querySelector("#tk-modal-keep");

    function closeDialog() {
      document.removeEventListener("keydown", onKeydown);
      backdrop.remove();
    }
    function onKeydown(e) {
      if (e.key === "Escape" && !confirmBtn.disabled) closeDialog();
    }
    function showResult(kind, heading, message, symbol) {
      card.classList.remove("tk-modal-success", "tk-modal-error");
      card.classList.add(kind === "success" ? "tk-modal-success" : "tk-modal-error");
      mark.textContent = symbol;
      title.textContent = heading;
      desc.textContent = message;
      confirmBtn.style.display = "none";
      keepBtn.textContent = "Done";
      keepBtn.focus();
    }

    keepBtn.addEventListener("click", closeDialog);
    backdrop.addEventListener("click", function (e) {
      if (e.target === backdrop && !confirmBtn.disabled) closeDialog();
    });
    document.addEventListener("keydown", onKeydown);

    confirmBtn.addEventListener("click", async function () {
      if (o.status !== "Order Placed" && o.status !== "Processing") {
        showResult("error", "Cancellation unavailable", "This order can no longer be cancelled. The status is being refreshed.", "×");
        await run(true);
        return;
      }
      if (!configured()) {
        showResult("error", "Service unavailable", "We couldn't reach the order service. Please try again later or contact us on WhatsApp.", "!");
        return;
      }

      confirmBtn.disabled = true;
      keepBtn.disabled = true;
      confirmBtn.textContent = "Cancelling…";
      mark.textContent = "…";
      title.textContent = "Please wait";
      desc.textContent = "We're updating your order status.";

      try {
        if (window.MADHURAVANA_SUPABASE && window.MADHURAVANA_SUPABASE.readyPromise) {
          await window.MADHURAVANA_SUPABASE.readyPromise;
        }
        var result = await cloud().rpc("cancel_order", {
          p_id: String(o.id),
          p_phone: digits(o.phone)
        });
        if (result.error) throw result.error;

        if (result.data !== true) {
          showResult("error", "Order not cancelled", "This order may already be dispatched or cancelled. The status is being refreshed.", "×");
          keepBtn.disabled = false;
          await run(true);
          return;
        }

        showResult("success", "Order cancelled", "Your order has been cancelled. Tap the button below to notify us on WhatsApp.", "✓");

        /* A real link tap is never blocked by the browser (unlike window.open after an await). */
        var message = [
          "❌ MADHURAVANA ORDER CANCELLED",
          "",
          "A customer has cancelled their honey order.",
          "Order ID: " + String(o.id || "Not available"),
          "Customer: " + String(o.name || "Not available"),
          "Phone: " + String(o.phone || "Not available"),
          "Order Total: ₹" + Number(o.total || 0).toLocaleString("en-IN"),
          "",
          "Please check the admin panel."
        ].join("\n");
        var wa = document.createElement("a");
        wa.className = "tk-modal-wa";
        wa.href = "https://wa.me/917092722605?text=" + encodeURIComponent(message);
        wa.target = "_blank";
        wa.rel = "noopener noreferrer";
        wa.textContent = "Notify us on WhatsApp";
        keepBtn.parentNode.insertBefore(wa, keepBtn);
        keepBtn.disabled = false;
        cancelBtn.disabled = true;
        await run(true);
      } catch (error) {
        console.error("Order cancellation failed:", error);
        showResult("error", "Couldn't cancel the order", "Something went wrong. Please try again or contact us on WhatsApp.", "!");
        keepBtn.disabled = false;
      }
    });
    confirmBtn.focus();
  }

  /* =========================================================
     MY ORDERS — only orders matching the customer's phone
  ========================================================= */
  function renderMyOrders(phoneFilter) {

    var box = $("#tk-orders");
    if (!box) return;

    var phone = digits(phoneFilter || "");

    /* Never show all orders. No valid phone = show nothing. */
    if (phone.length !== 10) {
      box.innerHTML = "";
      return;
    }

    var list = orders().filter(function (o) {
      return digits(o.phone) === phone;
    });

    if (!list.length) {
      box.innerHTML = "";
      return;
    }

    list = list.slice(0, 10);

    box.innerHTML =
      '<h2 class="tk-my-title">Your orders</h2>' +
      '<p class="tk-my-sub">Orders placed with this phone number.</p>' +
      list.map(function (o) {

        var n = (o.products || []).reduce(function (s, p) {
          return s + Number(p.quantity || 0);
        }, 0);

        var st = o.status || "Order Placed";
        var cls = st === "Cancelled" ? " bad" : (st === "Delivered" ? " done" : "");

        return (
          '<button type="button" class="tk-my" data-id="' + E(o.id) + '" data-phone="' + E(o.phone) + '">' +
            '<div class="lead">' +
              '<div>' +
                '<strong>' + E(o.id) + '</strong>' +
                '<small>' +
                  E(o.orderDate || "") + " · " + n + " item" + (n !== 1 ? "s" : "") + " · " + M(o.total || 0) +
                '</small>' +
              '</div>' +
            '</div>' +
            '<span class="tk-pill' + cls + '" data-pill="' + E(o.id) + '">' + E(statusLabel(st)) + '</span>' +
          '</button>'
        );
      }).join("");

    /* ---- click an order ---- */
    box.querySelectorAll(".tk-my").forEach(function (b) {
      b.addEventListener("click", function () {
        $("#tk-id").value = b.dataset.id;
        $("#tk-phone").value = digits(b.dataset.phone);
        run(false);
        out.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    /* ---- refresh status for this customer's orders only ---- */
    (async function () {
      for (var i = 0; i < list.length; i++) {
        try {
          var r = await lookup(list[i].id, phone);
          if (!r) continue;

          var pills = box.querySelectorAll(".tk-my .tk-pill");
          for (var k = 0; k < pills.length; k++) {
            if (pills[k].getAttribute("data-pill") === list[i].id) {
              pills[k].textContent = statusLabel(r.status);
              pills[k].className = "tk-pill" +
                (r.status === "Cancelled" ? " bad" : r.status === "Delivered" ? " done" : "");
            }
          }
        } catch (e) {}
      }
    })();
  }

  /* =========================================================
     TRACK ORDER
  ========================================================= */
  async function run(quiet) {

    var id = $("#tk-id").value.trim();
    var phone = $("#tk-phone").value.trim();
    var normalizedPhone = digits(phone);

    if (normalizedPhone.length !== 10) {
      out.innerHTML =
        '<div class="tk-msg"><span class="ic">!</span><div>' +
          '<b>Check the phone number</b>' +
          'Enter the 10-digit phone number used for the order.' +
        '</div></div>';
      clearInterval(timer);
      renderMyOrders("");
      return;
    }

    renderMyOrders(normalizedPhone);

    var btn = $("#tk-btn");

    if (!quiet) {
      btn.disabled = true;
      btn.textContent = "Checking…";
      out.innerHTML = '<div class="tk-skel"><i></i><i></i><i></i><i></i></div>';
    }

    var done = false;

    try {
      var o = await lookup(id, normalizedPhone);

      if (o) {
        render(o);
        done = (o.status === "Delivered" || o.status === "Cancelled");
      } else {
        out.innerHTML =
          '<div class="tk-msg"><span class="ic">?</span><div>' +
            '<b>No order found</b>' +
            'Check the order ID and phone number, then try again. Order IDs start with MH.' +
          '</div></div>';
      }

    } catch (e) {
      out.innerHTML =
        '<div class="tk-msg"><span class="ic">!</span><div>' +
          '<b>Could not check right now</b>' +
          'Please try again in a moment.' +
        '</div></div>';
      console.error(e);
    }

    btn.disabled = false;
    btn.textContent = "Track order";

    clearInterval(timer);

    /* Auto-refresh only while the order is still moving */
    if (out.querySelector(".tk-card") && !done) {
      timer = setInterval(function () {
        if (!document.hidden) run(true);
      }, 30000);
    }
  }

  /* =========================================================
     FORM SUBMIT
  ========================================================= */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    run(false);
  });

  /* =========================================================
     INITIAL LOAD (single initialization block)
  ========================================================= */
  var q = new URLSearchParams(location.search);
  var last = null;

  try { last = safeParse(KEYS.lastOrder, null); } catch (e) {}

  var pre = q.get("order") || (last && last.id) || "";

  $("#tk-id").value = pre;

  /* Restore only this customer's orders if this browser knows their phone */
  if (last && last.id === pre && last.phone) {

    var savedPhone = digits(last.phone);
    $("#tk-phone").value = savedPhone;
    renderMyOrders(savedPhone);
    run(false);

  } else if (pre) {
    $("#tk-phone").focus();
  }

})();
  </script>
</body>
</html>
